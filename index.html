<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自転車 右折ウィンカー</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-touch-callout: none;
        }

        /* ① 上部：画像エリア（間隔を広く保ち、重なりを完全に防止） */
        .marquee-container {
            display: flex;
            width: 200%;
            height: 64vh;
            align-items: center;
            animation: scrollSmooth 4s linear infinite;
        }
        .marquee-track {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 50%;
            height: 100%;
        }
        .item {
            display: flex;
            align-items: center;
        }

        /* 画像サイズとゆとりある黄色い枠 */
        .item img {
            height: 44vh;
            width: auto;
            object-fit: contain;
            border: 4px solid #ffff00;
            border-radius: 12px;
            padding: 8px;
            background-color: #0a0a0a;
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.6), inset 0 0 15px rgba(255, 255, 0, 0.3);
        }

        /* 画像と画像の間の十分な間隔（黄色い縦線） */
        .yellow-divider {
            width: 6px;
            height: 44vh;
            background-color: #ffff00;
            margin: 0 8vw; /* 間隔を広げてゆとりを持たせました */
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.9);
        }

        /* ② 下部：テロップエリア（1つの文に絞って重なりを完全に解消） */
        .notice-container {
            display: flex;
            width: 200%;
            height: 26vh;
            align-items: center;
            background-color: #000000;
            border-top: 2px solid rgba(255, 255, 0, 0.3);
            animation: scrollSmooth 4s linear infinite;
        }
        .notice-track {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 50%;
        }
        .notice-text {
            color: #ffff00;
            font-size: 6vh;
            font-weight: bold;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 0, 0.8);
            white-space: nowrap;
            letter-spacing: 0.15em;
        }

        /* 非常に滑らかなループアニメーション */
        @keyframes scrollSmooth {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- 上部：画像エリア -->
    <div class="marquee-container">
        <div class="marquee-track">
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
        </div>
        <div class="marquee-track">
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
        </div>
    </div>

    <!-- 下部：テロップエリア -->
    <div class="notice-container">
        <div class="notice-track">
            <div class="notice-text">➡ 右に寄ります！ ➡</div>
        </div>
        <div class="notice-track">
            <div class="notice-text">➡ 右に寄ります！ ➡</div>
        </div>
    </div>

</body>
</html>
