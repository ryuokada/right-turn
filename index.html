<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>自転車 右折ウィンカー</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            -webkit-touch-callout: none;
        }

        /* ① 上部：画像エリア */
        .marquee-container {
            display: flex;
            width: 200%;
            align-items: center;
            animation: scrollSmooth 4s linear infinite;
        }
        .marquee-track {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 50%;
            height: 100%;
        }
        .item {
            display: flex;
            align-items: center;
        }

        /* ② 下部：テロップエリア */
        .notice-container {
            display: flex;
            width: 200%;
            align-items: center;
            background-color: #000000;
            border-top: 2px solid rgba(255, 255, 0, 0.3);
            animation: scrollSmooth 4s linear infinite;
        }
        .notice-track {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 50%;
        }
        .notice-text {
            color: #ffff00;
            font-weight: bold;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 0, 0.8);
            white-space: nowrap;
            letter-spacing: 0.1em;
        }

        /* 画像の間に追加する黄色い矢印のスタイル */
        .yellow-arrow-divider {
            color: #ffff00;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.9);
            margin: 0 4vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================
           【スマホ縦画面（ポートレート）時の専用設定】
           ========================================== */
        @media (orientation: portrait) {
            .marquee-container {
                height: 68vh;
            }
            .item img {
                height: 32vh;
                width: auto;
                object-fit: contain;
                border: 3px solid #ffff00;
                border-radius: 10px;
                padding: 6px;
                background-color: #0a0a0a;
                box-shadow: 0 0 15px rgba(255, 255, 0, 0.6);
            }
            .yellow-arrow-divider {
                font-size: 7vh;
            }
            .notice-container {
                height: 18vh;
            }
            .notice-text {
                font-size: 4.5vh;
            }
        }

        /* ==========================================
           【スマホ横画面（ランドスケープ）時の専用設定】
           ========================================== */
        @media (orientation: landscape) {
            .marquee-container {
                height: 62vh;
            }
            .item img {
                height: 45vh;
                width: auto;
                object-fit: contain;
                border: 4px solid #ffff00;
                border-radius: 12px;
                padding: 8px;
                background-color: #0a0a0a;
                box-shadow: 0 0 25px rgba(255, 255, 0, 0.6), inset 0 0 15px rgba(255, 255, 0, 0.3);
            }
            .yellow-arrow-divider {
                font-size: 11vh;
            }
            .notice-container {
                height: 22vh;
            }
            .notice-text {
                font-size: 5.5vh;
            }
        }

        /* 滑らかな無限ループアニメーション */
        @keyframes scrollSmooth {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>

    <!-- 上部：画像と矢印エリア -->
    <div class="marquee-container">
        <div class="marquee-track">
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-arrow-divider">➡</div>
            </div>
        </div>
        <div class="marquee-track">
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-arrow-divider">➡</div>
            </div>
        </div>
    </div>

    <!-- 下部：テロップエリア -->
    <div class="notice-container">
        <div class="notice-track">
            <div class="notice-text">➡ 右に寄ります！ ➡</div>
        </div>
        <div class="notice-track">
            <div class="notice-text">➡ 右に寄ります！ ➡</div>
        </div>
    </div>

    <!-- 10秒後に自動で画面を閉じるプログラム -->
    <script>
        setTimeout(function() {
            window.close();
            setTimeout(function() {
                window.location.href = "about:blank";
            }, 100);
        }, 10000); // 確実に10秒に変更
    </script>
</body>
</html>
