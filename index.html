<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自転車 右折ウィンカー</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
        }

        /* 画像や区切り線を流すコンテナ */
        .marquee-container {
            display: flex;
            width: 200%;
            height: 60%;
            position: absolute;
            top: 5%;
            left: 0;
            align-items: center;
            animation: scrollLoop 3s linear infinite;
        }
        .marquee-track {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 50%;
            height: 100%;
        }
        .item {
            display: flex;
            align-items: center;
        }
        .item img {
            height: 45vh;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }

        /* 画像と画像の間の黄色い縦線 */
        .yellow-divider {
            width: 6px;
            height: 45vh;
            background-color: #ffff00;
            margin: 0 3vw;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.8);
        }

        /* 「右に寄ります！」を流すためのテロップ用コンテナ */
        .notice-container {
            display: flex;
            width: 200%;
            position: absolute;
            bottom: 5vh;
            left: 0;
            animation: scrollLoop 3s linear infinite;
        }
        .notice-track {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 50%;
        }

        /* 目立つ黄色い流れる文字のスタイル */
        .notice-text {
            color: #ffff00;
            font-size: 7vh;
            font-weight: bold;
            font-family: sans-serif;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 0, 0.6);
            white-space: nowrap;
            letter-spacing: 0.1em;
        }

        @keyframes scrollLoop {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }
    </style>
</head>
<body>
    <!-- 画像と黄色い縦線が流れるエリア -->
    <div class="marquee-container">
        <div class="marquee-track">
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
        </div>
        <div class="marquee-track">
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
        </div>
    </div>

    <!-- 「右に寄ります！」の文字が流れるエリア -->
    <div class="notice-container">
        <div class="notice-track">
            <div class="notice-text">右に寄ります！</div>
            <div class="notice-text">右に寄ります！</div>
        </div>
        <div class="notice-track">
            <div class="notice-text">右に寄ります！</div>
            <div class="notice-text">右に寄ります！</div>
        </div>
    </div>
</body>
</html>
