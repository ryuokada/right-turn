<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自転車 右折ウィンカー</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
            -webkit-touch-callout: none;
        }

        /* 画像が右方向に流れるエリア */
        .marquee-container {
            display: flex;
            width: 200%;
            height: 62%;
            position: absolute;
            top: 4%;
            left: -100%;
            align-items: center;
            animation: scrollRight 3s linear infinite;
        }
        .marquee-track {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 50%;
            height: 100%;
        }
        .item {
            display: flex;
            align-items: center;
        }

        /* 一枚一枚の画像に未来的な黄色い枠とグロー効果を付与 */
        .item img {
            height: 48vh;
            width: auto;
            object-fit: contain;
            border: 4px solid #ffff00;
            border-radius: 12px;
            padding: 6px;
            background-color: #0a0a0a;
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.6), inset 0 0 10px rgba(255, 255, 0, 0.3);
        }

        /* 画像と画像の間の黄色い縦線 */
        .yellow-divider {
            width: 6px;
            height: 48vh;
            background-color: #ffff00;
            margin: 0 3vw;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.9);
        }

        /* 「右に寄ります！」が重ならずにきれいに右へ流れるテロップエリア */
        .notice-container {
            display: flex;
            width: 200%;
            position: absolute;
            bottom: 3vh;
            left: -100%;
            animation: scrollRight 3s linear infinite;
        }
        .notice-track {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 50%;
        }
        .notice-text {
            color: #ffff00;
            font-size: 6vh;
            font-weight: bold;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 0, 0.8);
            white-space: nowrap;
            letter-spacing: 0.1em;
        }

        /* 右方向へスムーズに流すアニメーション */
        @keyframes scrollRight {
            0% { transform: translateX(0%); }
            100% { transform: translateX(50%); }
        }
    </style>
</head>
<body>
    <!-- 画像と黄色い縦線が右へ流れるエリア -->
    <div class="marquee-container">
        <div class="marquee-track">
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
        </div>
        <div class="marquee-track">
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
            <div class="item">
                <img src="IMG_6774.jpeg" alt="Finger">
                <div class="yellow-divider"></div>
            </div>
        </div>
    </div>

    <!-- 「右に寄ります！」が右へ流れるエリア -->
    <div class="notice-container">
        <div class="notice-track">
            <div class="notice-text">➡ 右に寄ります！ ➡</div>
            <div class="notice-text">➡ 右に寄ります！ ➡</div>
        </div>
        <div class="notice-track">
            <div class="notice-text">➡ 右に寄ります！ ➡</div>
            <div class="notice-text">➡ 右に寄ります！ ➡</div>
        </div>
    </div>
</body>
</html>
